<style>

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); overflow: hidden; }
  body { font-family: Roboto, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .mi { font-family: 'Material Icons Round'; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal;

  /* ── Pagina delle schermate ── */

  .phone { position: absolute; left: 50%; top: 520px; width: 380px; height: 800px; margin-left: -190px;
           transform: scale(1.62); transform-origin: top center; border-radius: 50px; background: #0B0B0B; padding: 10px;
           box-shadow: 0 40px 70px rgba(60,40,10,0.22), 0 6px 18px rgba(0,0,0,0.18), inset 0 0 0 1.5px #2b2b2b; }
  .screen { width: 360px; height: 780px; border-radius: 40px; overflow: hidden; position: relative; }
  .camera { position: absolute; top: 12px; left: 50%; margin-left: -6px; width: 12px; height: 12px; border-radius: 50%; background: #050505; z-index: 5; }

  .light { --bg: #F4F1EC; --uink: #1F1D1A; --usoft: #8B857C; --card: #FFFFFF; --line: #E4DED4; --uacc: #1E7F78; background: var(--bg); color: var(--uink); }
  .status { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 6px 22px 0; font-size: 13px; font-weight: 500; }

  .home { padding: 28px 24px 0; }
  .day { font-size: 31px; font-weight: 400; line-height: 38px; }
  .date { font-size: 31px; color: var(--usoft); line-height: 38px; font-weight: 300; }
  .weather { display: flex; align-items: center; margin-top: 12px; font-size: 18px; }
  .weather .mi { font-size: 20px; margin-right: 8px; }
  .dlabel { font-size: 13px; color: var(--usoft); margin: 12px 0 3px; }
  .aline { display: flex; font-size: 17px; padding: 5px 0; }
  .aline .t { min-width: 64px; padding-right: 12px; color: var(--usoft); }
  .aline .t.acc { color: var(--uacc); }
  .grow { flex: 1; }
  .search { margin: 0 16px; height: 52px; border-radius: 26px; background: var(--card); display: flex; align-items: center; padding: 0 18px 0 22px;

  .search .mi { margin-left: auto; color: var(--uacc); font-size: 24px; }
  .zone { height: 156px; margin: 12px 16px 16px; position: relative; display: flex; align-items: center; }
  .mascot { width: 44px; height: 60px; position: relative; flex: none; }
  .badge { position: absolute; top: -2px; right: -10px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--uacc); color: var(--bg);
           font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; padding: 0 5px; border: 2px solid var(--bg); }
  .bubble { margin-left: 10px; flex: 1; background: var(--card); border-radius: 24px; position: relative; padding: 12px 12px 12px 23px; min-height: 84px;
            display: flex; align-items: center; }
  .bubble:before { content: ''; position: absolute; left: -7px; top: 50%; margin-top: -9px; border-style: solid; border-width: 9px 9px 9px 0;
                   border-color: transparent var(--card) transparent transparent; }
  .bubble .col { flex: 1; min-width: 0; }
  .lab { font-size: 13px; color: var(--usoft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; margin-bottom: 2px; }
  .aic { width: 16px; height: 16px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; margin-right: 7px; color: #fff; flex: none; }
  .aic .mi { font-size: 11px; }
  .ttl { font-size: 19px; line-height: 24px; }
  .sub { font-size: 15px; color: var(--usoft); }
  .round { width: 48px; height: 48px; border-radius: 24px; background: var(--uacc); color: var(--bg); display: flex; align-items: center; justify-content: center; flex: none; margin-left: 8px; }
  .round .mi { font-size: 24px; }

  .track { height: 4px; border-radius: 2px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--uacc); border-radius: 2px; }
  .code { font-family: 'Roboto Mono', monospace; font-size: 28px; letter-spacing: 3px; }
  .handle { text-align: center; color: var(--usoft); margin: -6px 0 2px; }
  .handle .mi { font-size: 20px; }

  .sec { font-size: 18px; padding: 16px 20px 8px; }
  .sec span { color: var(--usoft); font-size: 15px; margin-left: 6px; }
  .block { margin: 0 12px 8px; background: var(--card); border-radius: 22px; padding: 12px 14px; }

  .bp { font-size: 14px; color: var(--usoft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .btime { font-size: 12px; color: var(--usoft); margin-left: 8px; }

  .sphead .back { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: 4px; }

  .spg.bot { border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }

  .spt span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .spt i { font-style: normal; font-size: 13px; color: var(--usoft); flex: none; margin-left: 4px; }

  .spmsg i { margin-left: auto; padding-left: 10px; font-style: normal; font-size: 12px; color: var(--usoft); }

  .icon { width: 512px; height: 512px; background: #F2EDE3; display: flex; align-items: center; justify-content: center; }
</style>
</head>

}

function shot(lang, n) {
  const t = T[lang];
  const i = n - 1;
  let inner = '';
  if (n === 1) {
    inner = phone('light', `${homeTop(t)}<div class="grow"></div>${searchBar(t)}
      <div class="zone">${mascot(3)}<div class="bubble"><div class="col">${sig('#1C6FD1', 'event', t.calendar + ' · 1/3')}<div class="ttl">${t.ev1}</div><div class="sub">${t.inMin}</div></div>
      <div class="round">${mi('videocam')}</div></div></div>`);
  } else if (n === 2) {
    // Gruppi chiusi come nell'app; Giulia aperta per far vedere i messaggi
    const av = (init, appCol, appIc) => `<div class="spav">${init}<small><span style="background:${appCol}">${mi(appIc)}</span></small></div>`;
    const avApp = (col, ic) => `<div class="spav app" style="background:${col}">${mi(ic)}</div>`;
    const chip = (n, up) => `<div class="spchip${n > 1 ? '' : ' one'}">${n > 1 ? n : ''}${mi(up ? 'keyboard_arrow_up' : 'keyboard_arrow_down')}</div>`;
    const grp = (cls, avatar, title, time, prev, n) => `<div class="spg ${cls}"><div class="sprow">${avatar}
      <div class="spcol"><div class="spt"><span>${title}</span><i>· ${time}</i></div><div class="spp">${prev}</div></div>${chip(n, false)}</div></div>`;
    inner = phone('dark', `<div class="sphead"><div class="back">${mi('arrow_back')}</div><div><h2>${t.sordina}</h2><p>${t.waiting} · 18:42</p></div></div>
      <div class="spsec">${t.people}</div>
      <div class="spg top"><div class="sprow">${av(t.p1[0], '#25A35A', 'chat')}
        <div class="spcol"><div class="spt"><span>${t.p1}</span><i>· 18:42</i></div></div>${chip(2, true)}</div>
        <div class="spmsg" style="padding-top:12px">${t.p1m}<i>18:40</i></div>
        <div class="spmsg">${t.p1m2}<i>18:42</i></div></div>
      ${grp('bot', av(t.p2[0], '#25A35A', 'chat'), t.p2, '18:15', t.p2s + ': ' + t.p2m, 3)}
      <div class="spsec">${t.work}</div>
      ${grp('top', avApp('#1C6FD1', 'mail'), t.w1s, '17:30', t.w1 + ' · ' + t.w1m, 1)}
      ${grp('bot', avApp('#5B5FC7', 'groups'), t.w2, '17:02', t.w2m, 2)}
      <div class="spsec">${t.shop}</div>
      ${grp('top bot', avApp('#8A6A3A', 'local_shipping'), t.s1s, '15:20', t.s1 + ' · ' + t.s1m, 1)}
      <div class="spall">${t.readAll}</div>`);
  } else if (n === 3) {
    inner = phone('dark', `${homeTop(t)}<div class="grow"></div>${searchBar(t)}
      <div class="zone">${mascot(2)}<div class="bubble"><div class="col">${sig('#2E7D5B', 'account_balance', t.bank + ' · 1/2')}<div class="code">482 913</div>
      <div class="track"><i style="width:72%"></i></div></div><div class="round">${mi('content_copy')}</div></div></div>`);
  } else if (n === 4) {
    inner = phone('dark', `${homeTop(t, false)}<div class="grow"></div>
      <div style="position:relative;height:0">
        <div style="position:absolute;left:70px;right:16px;bottom:-150px" class="bubble-tall">
          <div class="bubble" style="display:block;padding-top:4px;margin-left:0">
            <div class="handle">${mi('keyboard_arrow_down')}</div>
            <div style="margin:2px 0 10px">${doorPic()}</div>
            <div style="display:flex;align-items:center"><div class="col">${sig('#41BDF5', 'home', t.homeLab)}<div class="ttl">${t.homeTtl}</div><div class="sub">${t.homeSub}</div></div>
            <div class="round">${mi('check')}</div></div>
          </div></div></div>
      <div class="search" style="visibility:hidden"></div><div class="zone">${mascot(1)}</div>`);
  } else if (n === 5) {
    const res = (ic, tt, ts, go) => `<div class="res"><div class="ic">${mi(ic)}</div><div class="rc"><div class="rt">${tt}</div><div class="rs">${ts}</div></div>${go ? `<div class="go">${mi('keyboard_return')}</div>` : ''}</div>`;
    inner = phone('dark', `<div class="ihead">${t.search}<div class="apps">${mi('apps', 'font-size:22px')}</div></div>
      ${res('chat', t.r1, t.r1s, true)}${res('call', t.r2, t.r2s, false)}${res('timer', t.r3, t.r3s, false)}
      <div class="grow"></div>
      <div class="search" style="margin-bottom:12px"><span class="typed">${t.typed}</span><span class="caret"></span><span class="mi" style="color:var(--usoft);font-size:20px;margin-left:auto">close</span>${mi('mic', 'margin-left:14px')}</div>
      <div class="zone">${mascot(0)}</div>`);
  } else if (n === 6) {
    const faces = t.faces.map((f, k) => `<div class="face"><div class="c" style="background:${FACE[k]}">${f[0]}</div><div class="n">${f}</div></div>`).join('');
    const tile = (bg, ic) => `<div class="tile"><div class="appic" style="background:${bg}">${mi(ic)}</div></div>`;
    inner = phone('dark', `<div class="car"><div class="clock">8:42</div><div class="scene">${t.carScene}</div>
      <div class="dlabel" style="margin-top:26px">${t.today}</div><div class="aline"><span class="t acc">${t.carNext}</span><span>${t.carEv}</span></div></div>
      <div class="grow"></div><div class="faces">${faces}</div>
      <div class="tiles">${tile('#2E8B57', 'navigation')}${tile('#D9534F', 'music_note')}${tile('#3E8ED0', 'home')}</div>
      <div class="micbar">${mi('mic')}${t.mic}</div>
      <div class="zone" style="margin-top:8px">${mascot(0)}<div class="bubble"><div class="col">${sig('#D9534F', 'music_note', t.playing)}<div class="ttl">${t.song}</div><div class="sub">${t.artist}</div></div>
      <div class="round">${mi('pause')}</div><div class="round quiet" style="margin-left:6px">${mi('skip_next')}</div></div></div>`);
  } else if (n === 7) {
    return `<div class="shot"><div class="caption"><h1>${t.caps[i][0]}</h1><p>${t.caps[i][1]}</p></div>
      <div class="glow" style="top:120px"></div><svg style="position:absolute;left:50%;margin-left:-170px;top:560px" width="340" height="434"><use href="#brass"/></svg>
      <div class="promise">${t.promise.map(([ic, s]) => `<div>${mi(ic)}${s}</div>`).join('')}</div></div>`;
  }
  return `<div class="shot">${caption(t, i)}${inner}</div>`;
}

    <div class="say"><small>${t.fSmall}</small>${t.fSay}</div>
